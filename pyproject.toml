[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "application-self-improver"
version = "0.1.0"
description = "Checkpointed Codex and Jira application improvement loop"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
self-improve = "improver.cli:main"

[tool.setuptools.packages.find]
include = ["improver*"]
